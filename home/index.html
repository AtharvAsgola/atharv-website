<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atharv Asgola</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#008080;font-family:"MS Sans Serif",Tahoma,sans-serif;font-size:11px;color:#000;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:"MS Sans Serif",Tahoma,sans-serif}
a{color:#0000ff}
#desktop{position:relative;width:100%;height:calc(100dvh - 28px);overflow:hidden}
.desktop-icons{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:3px;height:calc(100% - 16px);align-items:flex-start;overflow:hidden}
.dicon{width:82px;min-height:60px;padding:2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;touch-action:manipulation}
.dicon.selected{background:#000080}
.dicon .icn{width:32px;height:32px;object-fit:contain}
.dicon span{color:#fff;text-shadow:1px 1px #000;text-align:center;line-height:1.1;padding:1px 2px}
.window{position:absolute;min-width:240px;min-height:160px;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:1px 1px 0 #000;display:flex;flex-direction:column;overflow:hidden}
.window.maximized{left:0!important;top:0!important;width:100%!important;height:calc(100dvh - 28px)!important}
.window.minimized{display:none!important}
.titlebar{height:18px;min-height:18px;background:linear-gradient(90deg,#000080 0%,#000080 32%,#1084d0 100%);color:#fff;padding:1px 2px;display:flex;justify-content:space-between;align-items:center;cursor:default;touch-action:none}
.window.blur .titlebar{background:linear-gradient(90deg,#808080 0%,#808080 32%,#b5b5b5 100%)}
.tb-left{display:flex;align-items:center;gap:3px;overflow:hidden;min-width:0}
.tb-left .icn{width:16px;height:16px;flex:0 0 auto}
.tb-left b{font-size:11px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-buttons{display:flex;gap:2px;flex:0 0 auto}
.tb-buttons button{width:16px;height:14px;padding:0;background:#c0c0c0;border:1px solid;border-color:#fff #000 #000 #fff;font-family:Arial,sans-serif;font-size:11px;font-weight:bold;cursor:pointer;line-height:10px;touch-action:manipulation}
.tb-buttons button:active{border-color:#000 #fff #fff #000}
.content{flex:1;overflow:auto;padding:10px;background:#c0c0c0;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.content.white{background:#fff;margin:2px;border:1px solid;border-color:#000 #fff #fff #000}
.content h2{margin:0 0 10px;font-size:13px}
.content p{line-height:1.4;margin:0 0 9px}
.proj{background:#fff;border:1px solid;border-color:#000 #fff #fff #000;padding:7px;margin-bottom:7px}
.proj b{display:block;margin-bottom:2px}
.proj small{color:#222;display:block;line-height:1.35}
.proj a{color:#0000ff;font-size:11px}
.field{margin-bottom:8px}
.field label{display:block;font-weight:bold;margin-bottom:2px}
.field input{width:100%;height:20px;border:1px solid;border-color:#000 #fff #fff #000;padding:2px 4px;font:11px "MS Sans Serif",Tahoma,sans-serif;background:#fff}
.btn{height:23px;background:#c0c0c0;border:1px solid;border-color:#fff #000 #000 #fff;padding:2px 10px;font:11px "MS Sans Serif",Tahoma,sans-serif;cursor:pointer;touch-action:manipulation}
.btn:active{border-color:#000 #fff #fff #000}
.resize-edge{position:absolute;z-index:5}
.re-n,.re-s{left:8px;right:8px;height:5px}.re-n{top:-2px;cursor:ns-resize}.re-s{bottom:-2px;cursor:ns-resize}
.re-e,.re-w{top:8px;bottom:8px;width:5px}.re-e{right:-2px;cursor:ew-resize}.re-w{left:-2px;cursor:ew-resize}
.re-nw,.re-ne,.re-sw,.re-se{width:9px;height:9px;z-index:6}.re-nw{top:-2px;left:-2px;cursor:nwse-resize}.re-se{right:-2px;bottom:-2px;cursor:nwse-resize}.re-ne{top:-2px;right:-2px;cursor:nesw-resize}.re-sw{left:-2px;bottom:-2px;cursor:nesw-resize}
.ie-menu{display:flex;align-items:center;gap:14px;height:20px;padding:1px 6px;background:#c0c0c0;border-bottom:1px solid #808080;white-space:nowrap;overflow:hidden}
.ie-menu span{cursor:pointer}
.ie-toolbar{display:flex;align-items:center;gap:3px;padding:3px;background:#c0c0c0;border-bottom:1px solid #808080;flex-wrap:nowrap}
.ie-toolbar .btn{padding:2px 7px;min-width:37px}
.ie-toolbar input{flex:1;min-width:80px;height:20px;border:1px solid;border-color:#000 #fff #fff #000;padding:2px 4px;font:11px "MS Sans Serif",Tahoma,sans-serif;background:#fff;user-select:text;-webkit-user-select:text}
.ie-address-label{padding:0 3px;white-space:nowrap}
.ie-page{padding:14px;background:#fff;min-height:100%;overflow:auto;user-select:text;-webkit-user-select:text}
.ie-page h2{margin:0 0 8px;font-size:15px;font-weight:bold}
.ie-page a{display:block;color:#0000ff;margin:7px 0;cursor:pointer}
.ie-status{height:18px;padding:2px 4px;background:#c0c0c0;border-top:1px solid #808080;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ie-external{height:100%;display:flex;flex-direction:column;background:#fff}
.ie-external iframe{width:100%;height:100%;border:0;background:#fff;flex:1}
.ie-external-note{padding:6px;border-top:1px solid #c0c0c0;background:#c0c0c0;user-select:text;-webkit-user-select:text}
.swatches{display:flex;gap:5px;margin:7px 0;flex-wrap:wrap}
.swatch{width:24px;height:24px;border:2px solid;border-color:#fff #000 #000 #fff;cursor:pointer}
.cp-row{display:flex;align-items:center;gap:7px;margin-bottom:10px}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin-bottom:4px}
textarea{width:100%;height:100%;border:0;resize:none;font:11px "Courier New",monospace;padding:6px;outline:0;user-select:text;-webkit-user-select:text}
.explorer{height:100%;display:flex;flex-direction:column;background:#fff}
.explorer-toolbar{display:flex;gap:3px;padding:3px;background:#c0c0c0;border-bottom:1px solid #808080}
.explorer-path{flex:1;height:20px;border:1px solid;border-color:#000 #fff #fff #000;background:#fff;padding:2px 4px;overflow:hidden;white-space:nowrap}
.explorer-view{padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;align-content:start;overflow:auto}
.explorer-item{display:flex;align-items:center;gap:6px;min-width:0;padding:3px;cursor:pointer}
.explorer-item:hover{background:#000080;color:#fff}
.explorer-item .icn{width:32px;height:32px;flex:0 0 auto}
.explorer-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#taskbar{position:fixed;left:0;bottom:0;width:100%;height:28px;background:#c0c0c0;border-top:2px solid #fff;display:flex;align-items:center;padding:2px;gap:3px;z-index:9999;min-width:0}
#startbtn{height:23px;min-width:61px;padding:0 5px 0 3px;background:#c0c0c0;border:1px solid;border-color:#fff #000 #000 #fff;font-weight:bold;font-size:11px;display:flex;align-items:center;gap:3px;cursor:pointer;touch-action:manipulation;flex:0 0 auto}
#startbtn.active{border-color:#000 #fff #fff #000}
#startbtn img{width:16px;height:16px}
#tasks{display:flex;gap:2px;flex:1;overflow-x:auto;overflow-y:hidden;height:23px;min-width:0;scrollbar-width:none;touch-action:pan-x}
#tasks::-webkit-scrollbar{display:none}
.taskitem{height:23px;padding:0 7px;background:#c0c0c0;border:1px solid;border-color:#fff #000 #000 #fff;display:flex;align-items:center;gap:3px;font-size:11px;max-width:170px;cursor:pointer;flex:0 0 auto;touch-action:none}
.taskitem .icn{width:16px;height:16px;flex:0 0 auto}
.taskitem.pressed{border-color:#000 #fff #fff #000}
.taskitem.dragging{opacity:.75}
.taskitem span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{height:23px;border:1px solid;border-color:#808080 #fff #fff #808080;padding:2px 7px;font-size:11px;display:flex;align-items:center;justify-content:center;min-width:58px;flex:0 0 auto}
#clock-date{display:none}
#startmenu{position:fixed;left:2px;bottom:28px;width:230px;max-width:calc(100vw - 4px);background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;display:none;flex-direction:row;z-index:10000;box-shadow:1px 1px 0 #000;max-height:calc(100dvh - 30px);overflow:visible}
#startmenu.open{display:flex}
.sm-strip{width:28px;flex:0 0 28px;background:#808080;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;font-weight:bold;font-size:14px;line-height:1;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;overflow:hidden}
.sm-items{flex:1;padding:3px;overflow:visible;min-width:0}
.smitem{position:relative;display:flex;align-items:center;gap:8px;min-height:31px;padding:3px 6px;cursor:pointer;font-size:11px;touch-action:manipulation}
.smitem:hover,.smitem.active,.smitem:focus-visible{background:#000080;color:#fff;outline:0}
.smitem .icn{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
.smitem > span.label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm-arrow{margin-left:auto;font-size:14px;line-height:1}
.smsep{height:1px;background:#808080;border-bottom:1px solid #fff;margin:3px 2px}
.smsub{position:absolute;left:100%;top:-3px;width:205px;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;padding:3px;display:none;box-shadow:1px 1px 0 #000;z-index:10001}
.smitem.sub-open > .smsub{display:block}
#shutdown{position:fixed;inset:0;background:#000;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20000;font-family:"Courier New",monospace;font-size:14px;text-align:center;padding:20px}
#shutdown.open{display:flex}
.shutdown-line{max-width:640px}
.shutdown-accent{color:#ffb400}
.shutdown-title{display:flex;align-items:center;gap:8px}
.shutdown-title img{width:32px;height:32px}
#contextmenu{position:fixed;width:170px;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;display:none;z-index:15000;padding:2px;box-shadow:1px 1px 0 #000}
#contextmenu.open{display:block}
.ctxitem{height:25px;padding:4px 7px;display:flex;align-items:center;cursor:pointer}
.ctxitem:hover{background:#000080;color:#fff}
@media(max-width:760px){
body{font-size:12px}
#desktop{height:calc(100dvh - 32px)}
#taskbar{height:32px;padding:2px;gap:2px}
#startbtn{height:27px;min-width:54px}
#startbtn img{width:18px;height:18px}
#tasks{height:27px}
.taskitem{height:27px;max-width:155px;padding:0 6px}
.taskitem .icn{width:18px;height:18px}
#clock{height:27px;min-width:59px}
#startmenu{bottom:32px;width:240px;max-height:calc(100dvh - 34px)}
.window{left:0!important;top:0!important;width:100%!important;height:calc(100dvh - 32px)!important;min-width:220px;min-height:140px}
.window.maximized{height:calc(100dvh - 32px)!important}
.window:not(.maximized){left:0!important;top:0!important;width:100%!important;height:calc(100dvh - 32px)!important}
.titlebar{height:22px;min-height:22px}
.tb-buttons button{width:21px;height:18px;font-size:12px}
.tb-left b{font-size:12px}
.tb-left .icn{width:18px;height:18px}
.content{padding:12px}
.smitem{min-height:38px}
.smsub{position:fixed;left:30px;right:3px;top:auto;bottom:auto;width:auto;max-width:calc(100vw - 33px);max-height:60dvh;overflow:auto}
.ie-menu{gap:12px;overflow-x:auto;min-height:24px}
.ie-toolbar{flex-wrap:wrap}
.ie-toolbar input{order:5;flex-basis:100%;width:100%}
.ie-address-label{order:4}
.explorer-view{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.dicon{width:74px}
.resize-edge{display:none}
#contextmenu{display:none!important}
}
@media(max-width:420px){
.startlabel{display:none}
#startbtn{min-width:34px;justify-content:center}
#tasks{max-width:none}
#clock{min-width:53px;padding:2px 5px}
}
</style>
</head>
<body>
<div id="desktop"><div class="desktop-icons" id="deskicons"></div></div>
<div id="startmenu"><div class="sm-strip">Windows 98</div><div class="sm-items" id="smitems"></div></div>
<div id="taskbar"><div id="startbtn"><img src="../win98-icons/windows.ico" alt=""><span class="startlabel">Start</span></div><div id="tasks"></div><div id="clock" title=""><div id="clock-time"></div><div id="clock-date"></div></div></div>
<div id="shutdown"><div class="shutdown-line shutdown-accent">Windows 98</div><div class="shutdown-line">Please wait while your computer shuts down...</div><div class="shutdown-line">It's now safe to turn off your computer.</div><button class="btn" onclick="closeShutdown()">Turn back on</button></div>
<div id="contextmenu"></div>
<script>
const ICON_BASE="../win98-icons/";
const CONFIG={
aboutParagraphs:[
"Game Dev and programmer. I work in Lua, Luau (Roblox), C# (Unity & BepInEx game modding) and the web (frontend and backend).",
"Programming has been my passion, it has it's pros and cons, but I personally find it fun to program - until I have to debug the code :("
],
projects:[
{title:"World of Countries",desc:"Roblox nation-building game - Luau"},
{title:"Ages of Conflict Mods",desc:"C# BepInEx/Harmony mods - The Greatest Modpack"},
{title:"AoC Forum",desc:"Forum available as a website for the game Ages of Conflict - uses React, Vite and Supabase.",link:"http://aoc-forum.pages.dev/"},
{title:"Paintable World Map",desc:"Roblox EditableImage-based map painting system"}
],
email:"asgolaatharv@gmail.com",
github:"https://github.com/atharvasgola"
};
const APPS=[
{id:"about",label:"About Me",icon:"user_card.ico",multi:false},
{id:"projects",label:"Projects",icon:"directory_closed.ico",multi:true},
{id:"contact",label:"Contact",icon:"envelope_closed.ico",multi:false},
{id:"mycomputer",label:"My Computer",icon:"computer_win.ico",multi:true},
{id:"mydocuments",label:"My Documents",icon:"directory_open_file_mydocs.ico",multi:true},
{id:"network",label:"Network Neighborhood",icon:"connected_world.ico",multi:false},
{id:"recyclebin",label:"Recycle Bin",icon:"recycle_bin_empty.ico",multi:false},
{id:"games",label:"Games",icon:"joystick.ico",multi:false},
{id:"notepad",label:"Notepad",icon:"notepad.ico",multi:true},
{id:"iexplore",label:"Internet Explorer",icon:"msie_box.ico",multi:true},
{id:"settings",label:"Control Panel",icon:"directory_control_panel.ico",multi:false}
];
const START_GROUPS={
programs:[
{label:"Internet Explorer",icon:"msie_box.ico",action:()=>openWin("iexplore",{url:"about:home"})},
{label:"Notepad",icon:"notepad.ico",action:()=>openWin("notepad")},
{label:"Windows Explorer",icon:"computer_explorer.ico",action:()=>openWin("mycomputer")},
{label:"Games",icon:"joystick.ico",action:()=>openWin("games")}
],
favorites:[
{label:"GitHub",icon:"world_star.ico",action:()=>openWin("iexplore",{url:CONFIG.github})},
{label:"AoC Forum",icon:"world_star.ico",action:()=>openWin("iexplore",{url:CONFIG.projects.find(p=>p.link).link})}
],
documents:[
{label:"My Documents",icon:"directory_open_file_mydocs.ico",action:()=>openWin("mydocuments")}
],
settings:[
{label:"Control Panel",icon:"directory_control_panel.ico",action:()=>openWin("settings")},
{label:"Find",icon:"computer_search.ico",action:()=>showFind()},
{label:"Help",icon:"circle_question.ico",action:()=>showHelp()}
]
};
function icon(name){return '<img class="icn" src="'+ICON_BASE+name+'" alt="">'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function buildContent(appId,instance,options={}){
if(appId==="about")return CONFIG.aboutParagraphs.map(p=>"<p>"+esc(p)+"</p>").join("");
if(appId==="projects")return CONFIG.projects.map(p=>"<div class=\"proj\"><b>"+esc(p.title)+"</b><small>"+esc(p.desc)+"</small>"+(p.link?"<a href=\""+esc(p.link)+"\" target=\"_blank\" rel=\"noopener\" class=\"ie-link\">"+esc(p.link)+"</a>":"")+"</div>").join("");
if(appId==="contact")return "<div class=\"field\"><label>Email</label><input readonly value=\""+esc(CONFIG.email)+"\"></div><div class=\"field\"><label>GitHub</label><input readonly value=\""+esc(CONFIG.github)+"\"></div>";
if(appId==="mycomputer")return explorerContent(instance,[
["floppy_drive_3-5.ico","3½ Floppy (A:)","A:"],
["hard_disk_drive.ico","Local Disk (C:)","C:"],
["cd_drive.ico","CD Drive (D:)","D:"]
]);
if(appId==="mydocuments")return explorerContent(instance,[["directory_open_file_mydocs.ico","My Documents","docs"]]);
if(appId==="network")return "<h2>Network Neighborhood</h2><p>Computers connected to this network:</p><div class=\"proj\"><b>Atharv-PC</b><small>Entire Network</small></div>";
if(appId==="recyclebin")return "<h2>Recycle Bin</h2><p>The Recycle Bin is empty.</p>";
if(appId==="games")return "<h2>Games</h2><div class=\"explorer-view\"><div class=\"explorer-item\">"+icon("joystick.ico")+"<span>Games</span></div></div>";
if(appId==="notepad")return "<textarea spellcheck=\"false\">New Text Document</textarea>";
if(appId==="settings")return "<div class=\"cp-row\"><b>Display Properties</b></div><div>Desktop background:</div><div class=\"swatches\"><div class=\"swatch\" style=\"background:#008080\" data-bg=\"#008080\"></div><div class=\"swatch\" style=\"background:#000080\" data-bg=\"#000080\"></div><div class=\"swatch\" style=\"background:#800000\" data-bg=\"#800000\"></div><div class=\"swatch\" style=\"background:#004000\" data-bg=\"#004000\"></div><div class=\"swatch\" style=\"background:#404040\" data-bg=\"#404040\"></div></div>";
if(appId==="iexplore")return buildIE(instance,options.url||"about:home",options.history||[]);
return "";
}
function explorerContent(instance,items){return "<div class=\"explorer\"><div class=\"explorer-toolbar\"><button class=\"btn\" data-explorer-up>Up</button><div class=\"explorer-path\">My Computer</div></div><div class=\"explorer-view\">"+items.map(x=>"<div class=\"explorer-item\" data-drive=\""+esc(x[2])+"\">"+icon(x[0])+"<span>"+esc(x[1])+"</span></div>").join("")+"</div></div>"}
function buildIE(instance,url){
return "<div class=\"ie-menu\"><span data-ie-menu=\"file\">File</span><span data-ie-menu=\"edit\">Edit</span><span data-ie-menu=\"view\">View</span><span data-ie-menu=\"go\">Go</span><span data-ie-menu=\"favorites\">Favorites</span><span data-ie-menu=\"help\">Help</span></div><div class=\"ie-toolbar\"><button class=\"btn\" data-ie-back>&lt;</button><button class=\"btn\" data-ie-forward>&gt;</button><button class=\"btn\" data-ie-stop>Stop</button><button class=\"btn\" data-ie-home>Home</button><button class=\"btn\" data-ie-new>New Window</button><span class=\"ie-address-label\">Address</span><input class=\"ieaddr\" data-ie-address value=\""+esc(url)+"\"><button class=\"btn\" data-ie-go>Go</button></div><div class=\"ie-page\" data-ie-page></div><div class=\"ie-status\" data-ie-status>Done</div>";
}
const windows=new Map();
let nextWindowId=1;
let zTop=20;
const isMobile=()=>window.innerWidth<=760;
function appDef(id){return APPS.find(a=>a.id===id)}
function openWin(appId,options={}){
const app=appDef(appId);
if(!app)return;
if(!app.multi){const existing=[...windows.values()].find(w=>w.appId===appId);if(existing){restoreWin(existing.id);return existing.id}}
const id=nextWindowId++;
const el=document.createElement("div");
el.className="window";
el.id="w-"+id;
const count=windows.size;
if(!isMobile()){el.style.left=(55+(count%7)*24)+"px";el.style.top=(35+(count%7)*24)+"px";el.style.width=appId==="iexplore"?"720px":"390px";el.style.height=appId==="iexplore"?"460px":"300px"}
const data={id,appId,el,min:false,max:isMobile(),history:[],historyIndex:-1,currentUrl:options.url||"about:home"};
el.innerHTML="<div class=\"titlebar\" data-id=\""+id+"\"><div class=\"tb-left\">"+icon(app.icon)+"<b data-window-title>"+esc(windowTitle(app,options.url||""))+"</b></div><div class=\"tb-buttons\"><button data-act=\"min\" aria-label=\"Minimize\">_</button><button data-act=\"max\" aria-label=\"Maximize\">□</button><button data-act=\"close\" aria-label=\"Close\">×</button></div></div><div class=\"content"+(appId==="iexplore"||appId==="notepad"?"":" white")+" style=\""+(appId==="iexplore"||appId==="notepad"?"padding:0":"")+"\">"+buildContent(appId,id,options)+"</div><div class=\"resize-handle resize-edge re-n\"></div><div class=\"resize-handle resize-edge re-s\"></div><div class=\"resize-handle resize-edge re-e\"></div><div class=\"resize-handle resize-edge re-w\"></div><div class=\"resize-handle resize-edge re-nw\"></div><div class=\"resize-handle resize-edge re-ne\"></div><div class=\"resize-handle resize-edge re-sw\"></div><div class=\"resize-handle resize-edge re-se\"></div>";
document.getElementById("desktop").appendChild(el);
windows.set(id,data);
if(data.max)el.classList.add("maximized");
bindWindow(data);
if(appId==="iexplore")navigateIE(id,data.currentUrl,false);
if(appId==="settings")bindSettings(el);
addTask(data);
focusWin(id);
syncTasks();
return id;
}
function windowTitle(app,url){if(app.id==="iexplore")return url&&url!=="about:home"?"Microsoft Internet Explorer - "+url:"Microsoft Internet Explorer";return app.label}
function bindWindow(w){
const el=w.el,tb=el.querySelector(".titlebar");
let drag=null;
tb.addEventListener("pointerdown",e=>{
if(e.target.closest(".tb-buttons"))return;
focusWin(w.id);
if(w.max)return;
el.setPointerCapture?.(e.pointerId);
drag={x:e.clientX,y:e.clientY,left:el.offsetLeft,top:el.offsetTop,pointerId:e.pointerId};
});
tb.addEventListener("pointermove",e=>{if(!drag||w.max)return;el.style.left=Math.max(0,drag.left+e.clientX-drag.x)+"px";el.style.top=Math.max(0,drag.top+e.clientY-drag.y)+"px"});
tb.addEventListener("pointerup",e=>{if(drag){drag=null;try{el.releasePointerCapture?.(e.pointerId)}catch{}}});
tb.addEventListener("dblclick",e=>{if(!e.target.closest(".tb-buttons")&&!isMobile())toggleMax(w.id)});
el.querySelector('[data-act="close"]').onclick=()=>closeWin(w.id);
el.querySelector('[data-act="min"]').onclick=()=>minWin(w.id);
el.querySelector('[data-act="max"]').onclick=()=>toggleMax(w.id);
el.addEventListener("pointerdown",()=>focusWin(w.id));
for(const edge of el.querySelectorAll(".resize-edge"))bindResize(w,edge);
if(w.appId==="iexplore")bindIE(w);
}
function bindResize(w,edge){edge.addEventListener("pointerdown",e=>{if(w.max||isMobile())return;e.preventDefault();e.stopPropagation();focusWin(w.id);const el=w.el,sx=e.clientX,sy=e.clientY,ol=el.offsetLeft,ot=el.offsetTop,ow=el.offsetWidth,oh=el.offsetHeight;const type=[...edge.classList].find(c=>c==="re-n"||c==="re-s"||c==="re-e"||c==="re-w"||c==="re-nw"||c==="re-ne"||c==="re-sw"||c==="re-se");function mv(ev){let l=ol,t=ot,r=ow,b=oh;if(type.includes("e"))r=ow+ev.clientX-sx;if(type.includes("s"))b=oh+ev.clientY-sy;if(type.includes("w")){r=ow-(ev.clientX-sx);l=ol+(ev.clientX-sx)}if(type.includes("n")){b=oh-(ev.clientY-sy);t=ot+(ev.clientY-sy)}if(r>=240)el.style.width=r+"px";if(b>=140)el.style.height=b+"px";if(type.includes("w")&&r>=240)el.style.left=Math.max(0,l)+"px";if(type.includes("n")&&b>=140)el.style.top=Math.max(0,t)+"px"}function up(){document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up)}document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up)})}
function focusWin(id){const w=windows.get(id);if(!w)return;windows.forEach(v=>v.el.classList.add("blur"));w.el.classList.remove("blur");w.el.style.zIndex=++zTop;w.el.style.display="flex";w.min=false;syncTasks();if(w.appId!=="iexplore")return}
function minWin(id){const w=windows.get(id);if(!w)return;w.el.classList.add("minimized");w.min=true;syncTasks()}
function restoreWin(id){const w=windows.get(id);if(!w)return;if(w.min){w.el.classList.remove("minimized");focusWin(id);return}if(w.el.classList.contains("blur")){focusWin(id);return}minWin(id)}
function toggleMax(id){const w=windows.get(id);if(!w||isMobile())return;w.max=!w.max;w.el.classList.toggle("maximized",w.max);focusWin(id)}
function closeWin(id){const w=windows.get(id);if(!w)return;w.el.remove();windows.delete(id);const t=document.querySelector('.taskitem[data-id="'+id+'"]');if(t)t.remove();focusHighest();syncTasks()}
function focusHighest(){let top=null;windows.forEach(w=>{if(w.el.classList.contains("minimized"))return;const z=parseInt(w.el.style.zIndex||0,10);if(!top||z>top.z)top={w,z}});if(top)focusWin(top.w.id)}
function addTask(w){const t=document.createElement("div");t.className="taskitem";t.dataset.id=w.id;t.innerHTML=icon(appDef(w.appId).icon)+"<span>"+esc(taskTitle(w))+"</span>";t.addEventListener("click",e=>{if(t.dataset.dragged==="1"){t.dataset.dragged="0";return}restoreWin(w.id)});bindTaskDrag(t);document.getElementById("tasks").appendChild(t)}
function taskTitle(w){return w.appId==="iexplore"?"Internet Explorer":appDef(w.appId).label}
function syncTasks(){document.querySelectorAll(".taskitem").forEach(t=>{const w=windows.get(Number(t.dataset.id));t.classList.toggle("pressed",!!w&&!w.min&&!w.el.classList.contains("blur"));if(w)t.title=appDef(w.appId).label})}
function bindTaskDrag(t){let drag=null,moved=false;t.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};moved=false});t.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!moved&&Math.hypot(dx,dy)>6){moved=true;t.dataset.dragged="1";t.classList.add("dragging");try{t.setPointerCapture(e.pointerId)}catch{}}if(moved){const tasks=document.getElementById("tasks");const siblings=[...tasks.querySelectorAll(".taskitem:not(.dragging)")];let before=null,best=Infinity;for(const s of siblings){const r=s.getBoundingClientRect();const d=Math.abs(e.clientX-(r.left+r.width/2));if(d<best){best=d;before=e.clientX<r.left+r.width/2?s:null}}if(before)tasks.insertBefore(t,before);else tasks.appendChild(t)}});t.addEventListener("pointerup",e=>{if(moved){t.classList.remove("dragging");drag=null;saveTaskOrder()}else drag=null});t.addEventListener("pointercancel",()=>{t.classList.remove("dragging");drag=null})}
function saveTaskOrder(){localStorage.setItem("a98-task-order",JSON.stringify([...document.querySelectorAll(".taskitem")].map(x=>Number(x.dataset.id))))}
function restoreTaskOrder(){const order=JSON.parse(localStorage.getItem("a98-task-order")||"[]");const tasks=document.getElementById("tasks");for(const id of order){const t=[...tasks.children].find(x=>Number(x.dataset.id)===id);if(t)tasks.appendChild(t)}}
function bindSettings(el){el.querySelectorAll(".swatch").forEach(s=>s.addEventListener("click",()=>setBg(s.dataset.bg)))}
function setBg(c){document.body.style.background=c;localStorage.setItem("a98-bg",c)}
function buildDeskIcons(){const root=document.getElementById("deskicons");root.innerHTML="";APPS.forEach(a=>{const d=document.createElement("div");d.className="dicon";d.innerHTML=icon(a.icon)+"<span>"+esc(a.label)+"</span>";d.addEventListener("click",()=>{document.querySelectorAll(".dicon").forEach(x=>x.classList.remove("selected"));d.classList.add("selected");openWin(a.id)});root.appendChild(d)})}
function makeSmItem(item){const s=document.createElement("div");s.className="smitem";s.innerHTML=icon(item.icon)+"<span class=\"label\">"+esc(item.label)+"</span>";s.addEventListener("click",()=>{item.action();closeStart()});return s}
function positionMobileSubmenu(s){const sub=s.querySelector(".smsub");const r=s.getBoundingClientRect();const h=Math.min(sub.scrollHeight,window.innerHeight-8);sub.style.top=Math.max(3,Math.min(window.innerHeight-h-3,r.top))+"px";sub.style.left="3px";sub.style.right="3px"}function makeSubItem(label,items,iconName){const s=document.createElement("div");s.className="smitem has-sub";s.innerHTML=icon(iconName)+"<span class=\"label\">"+esc(label)+"</span><span class=\"sm-arrow\">›</span><div class=\"smsub\"></div>";const sub=s.querySelector(".smsub");items.forEach(i=>sub.appendChild(makeSmItem(i)));let timer=null,longPressed=false;s.addEventListener("mouseenter",()=>{if(isMobile())return;s.classList.add("sub-open")});s.addEventListener("mouseleave",()=>{if(isMobile())return;s.classList.remove("sub-open")});s.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch")return;longPressed=false;clearTimeout(timer);timer=setTimeout(()=>{longPressed=true;s.classList.add("sub-open");s.classList.add("active");positionMobileSubmenu(s)},550)});s.addEventListener("pointerup",e=>{if(e.pointerType!=="touch")return;clearTimeout(timer);if(longPressed)e.preventDefault()});s.addEventListener("pointercancel",()=>clearTimeout(timer));return s}
function buildStartMenu(){const root=document.getElementById("smitems");root.innerHTML="";root.appendChild(makeSubItem("Programs",START_GROUPS.programs,"directory_program_group.ico"));root.appendChild(makeSubItem("Favorites",START_GROUPS.favorites,"directory_favorites.ico"));root.appendChild(makeSubItem("Documents",START_GROUPS.documents,"directory_open_file_mydocs.ico"));root.appendChild(makeSubItem("Settings",START_GROUPS.settings,"directory_control_panel.ico"));root.appendChild(makeSmItem({label:"Windows Update",icon:"windows_update_small.ico",action:()=>openWin("iexplore",{url:"about:home"})}));root.appendChild(makeSmItem({label:"Log Off...",icon:"user_card.ico",action:()=>showLogoff()}));const sep=document.createElement("div");sep.className="smsep";root.appendChild(sep);root.appendChild(makeSmItem({label:"Shut Down...",icon:"shut_down_with_computer.ico",action:()=>{closeStart();openShutdown()}}))}
function showFind(){openWin("iexplore",{url:"about:find"})}
function showHelp(){openWin("iexplore",{url:"about:help"})}
function showLogoff(){closeStart();openShutdown()}
const startbtn=document.getElementById("startbtn"),startmenu=document.getElementById("startmenu");startbtn.addEventListener("click",e=>{e.stopPropagation();startmenu.classList.toggle("open");startbtn.classList.toggle("active")});document.addEventListener("click",e=>{if(!startmenu.contains(e.target)&&!startbtn.contains(e.target))closeStart()});function closeStart(){startmenu.classList.remove("open");startbtn.classList.remove("active");document.querySelectorAll(".smitem.sub-open").forEach(x=>x.classList.remove("sub-open"));document.querySelectorAll(".smitem.active").forEach(x=>x.classList.remove("active"))}
function openShutdown(){document.getElementById("shutdown").classList.add("open")}
function closeShutdown(){document.getElementById("shutdown").classList.remove("open")}
function localIEPage(url){
if(url==="about:home")return "<h2>Welcome to Microsoft Internet Explorer</h2><p>Atharv Asgola</p><p>Internet Explorer-style browsing inside the Windows 98 desktop.</p><a class=\"ie-link\" data-url=\"about:me\">About Me</a><a class=\"ie-link\" data-url=\"about:projects\">Projects</a><a class=\"ie-link\" data-url=\"about:contact\">Contact</a><a class=\"ie-link-new\" data-url=\""+esc(CONFIG.github)+"\">GitHub — Open in New Window</a><a class=\"ie-link-new\" data-url=\""+esc(CONFIG.projects.find(p=>p.link).link)+"\">AoC Forum — Open in New Window</a><p style=\"margin-top:18px\">File → New Window opens another Internet Explorer window just like a multi-window desktop.</p>";
if(url==="about:me")return "<h2>About Atharv</h2>"+CONFIG.aboutParagraphs.map(p=>"<p>"+esc(p)+"</p>").join("")+"<a class=\"ie-link\" data-url=\"about:home\">Back to Home</a>";
if(url==="about:projects")return "<h2>Projects</h2>"+CONFIG.projects.map(p=>"<p><b>"+esc(p.title)+"</b><br>"+esc(p.desc)+(p.link?"<br><a class=\"ie-link-new\" data-url=\""+esc(p.link)+"\">Open link in new window</a>":"")+"</p>").join("")+"<a class=\"ie-link\" data-url=\"about:home\">Back to Home</a>";
if(url==="about:contact")return "<h2>Contact</h2><p>Email: <a href=\"mailto:"+esc(CONFIG.email)+"\">"+esc(CONFIG.email)+"</a></p><p>GitHub: <a class=\"ie-link-new\" data-url=\""+esc(CONFIG.github)+"\">"+esc(CONFIG.github)+"</a></p><a class=\"ie-link\" data-url=\"about:home\">Back to Home</a>";
if(url==="about:find")return "<h2>Find</h2><p>Use the browser address bar or open Programs to find an application.</p>";
if(url==="about:help")return "<h2>Windows 98 Help</h2><p>Double-click title bars to maximize windows on desktop. Drag task buttons to reorganize them. On touch devices, hold Start-menu submenu entries to open them.</p>";
return null;
}
function bindIE(w){const el=w.el;el.querySelector("[data-ie-home]").onclick=()=>navigateIE(w.id,"about:home",true);el.querySelector("[data-ie-new]").onclick=()=>openWin("iexplore",{url:w.currentUrl});el.querySelector("[data-ie-back]").onclick=()=>ieHistory(w.id,-1);el.querySelector("[data-ie-forward]").onclick=()=>ieHistory(w.id,1);el.querySelector("[data-ie-go]").onclick=()=>navigateIE(w.id,el.querySelector("[data-ie-address]").value,true);el.querySelector("[data-ie-stop]").onclick=()=>{el.querySelector("[data-ie-status]").textContent="Stopped"};el.querySelector("[data-ie-address]").addEventListener("keydown",e=>{if(e.key==="Enter")navigateIE(w.id,e.currentTarget.value,true)});el.querySelectorAll("[data-ie-menu]").forEach(m=>m.addEventListener("click",()=>handleIEMenu(w.id,m.dataset.ieMenu)));el.querySelector("[data-ie-page]").addEventListener("click",e=>{const a=e.target.closest(".ie-link,.ie-link-new");if(!a)return;e.preventDefault();const url=a.dataset.url;if(a.classList.contains("ie-link-new"))openWin("iexplore",{url});else navigateIE(w.id,url,true)})}
function handleIEMenu(id,name){if(name==="file")openWin("iexplore",{url:"about:home"});else if(name==="go")navigateIE(id,"about:home",true);else if(name==="favorites")openWin("iexplore",{url:CONFIG.github});else if(name==="help")navigateIE(id,"about:help",true)}
function navigateIE(id,url,addHistory=true){const w=windows.get(id);if(!w)return;let target=url.trim();if(!target)target="about:home";w.currentUrl=target;if(addHistory){w.history=w.history.slice(0,w.historyIndex+1);w.history.push(target);w.historyIndex=w.history.length-1}const page=w.el.querySelector("[data-ie-page]"),addr=w.el.querySelector("[data-ie-address]"),status=w.el.querySelector("[data-ie-status]"),title=w.el.querySelector("[data-window-title]");addr.value=target;title.textContent=windowTitle(appDef("iexplore"),target);status.textContent="Opening "+target+"...";const local=localIEPage(target);if(local!==null){page.className="ie-page";page.innerHTML=local;status.textContent="Done";return}page.className="ie-external";page.innerHTML="<iframe src=\""+esc(target)+"\"></iframe><div class=\"ie-external-note\">If the page refuses to display here, <a href=\""+esc(target)+"\" target=\"_blank\" rel=\"noopener\">open it in your normal browser</a>.</div>";status.textContent="Internet";}
function ieHistory(id,dir){const w=windows.get(id);if(!w)return;const i=w.historyIndex+dir;if(i<0||i>=w.history.length)return;w.historyIndex=i;navigateIE(id,w.history[i],false)}
function tick(){const d=new Date();let h=d.getHours();const m=d.getMinutes();const ap=h>=12?"PM":"AM";h=h%12||12;const text=h+":"+(m<10?"0":"")+m+" "+ap;document.getElementById("clock-time").textContent=text;document.getElementById("clock").title=d.toLocaleDateString()}
tick();setInterval(tick,10000);
document.addEventListener("contextmenu",e=>{if(isMobile())return;if(e.target.closest(".window"))return;e.preventDefault();const menu=document.getElementById("contextmenu");menu.innerHTML="<div class=\"ctxitem\" data-ctx=\"new-ie\">New Internet Explorer Window</div><div class=\"ctxitem\" data-ctx=\"refresh\">Refresh</div><div class=\"ctxitem\" data-ctx=\"about\">About Windows 98</div>";menu.style.left=Math.min(e.clientX,window.innerWidth-174)+"px";menu.style.top=Math.min(e.clientY,window.innerHeight-100)+"px";menu.classList.add("open")});document.addEventListener("click",e=>{const c=e.target.closest(".ctxitem");if(c){if(c.dataset.ctx==="new-ie")openWin("iexplore",{url:"about:home"});if(c.dataset.ctx==="refresh")location.reload();if(c.dataset.ctx==="about")openWin("about")}document.getElementById("contextmenu").classList.remove("open")});
window.addEventListener("resize",()=>{if(isMobile())windows.forEach(w=>{w.el.classList.add("maximized");w.max=true});else windows.forEach(w=>{if(w.max){w.max=true;w.el.classList.add("maximized")}});document.querySelectorAll(".smitem.sub-open").forEach(positionMobileSubmenu)});
const savedBg=localStorage.getItem("a98-bg");if(savedBg)document.body.style.background=savedBg;
buildDeskIcons();buildStartMenu();
</script>
