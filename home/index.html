<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atharv Asgola</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#008080;
  font-family:"MS Sans Serif",Tahoma,Geneva,sans-serif;
  font-size:13px;
  overflow:hidden;
  -webkit-user-select:none;
  user-select:none;
}
#desktop{
  position:relative;
  width:100%;
  height:calc(100vh - 34px);
  overflow:hidden;
}
.desktop-icons{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  flex-direction:column;
  gap:2px;
  flex-wrap:wrap;
  height:calc(100% - 20px);
  align-content:flex-start;
}
.dicon{
  width:72px;
  padding:4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
}
.dicon .icn{
  width:32px;
  height:32px;
  object-fit:contain;
}
.dicon span{
  color:#fff;
  text-shadow:1px 1px 1px #000;
  text-align:center;
  line-height:1.15;
  padding:1px 2px;
}
.window{
  position:absolute;
  min-width:240px;
  min-height:160px;
  background:#c0c0c0;
  border:2px solid;
  border-color:#fff #404040 #404040 #fff;
  box-shadow:3px 3px 6px rgba(0,0,0,.5);
  display:flex;
  flex-direction:column;
}
.resize-handle{
  position:absolute;
  right:0;
  bottom:0;
  width:14px;
  height:14px;
  cursor:nwse-resize;
  background:
    linear-gradient(135deg,transparent 0 40%,#404040 40% 46%,transparent 46% 60%,#404040 60% 66%,transparent 66% 80%,#404040 80% 86%,transparent 86%);
}
.window.maximized .resize-handle{
  display:none;
}
.window.maximized{
  left:0!important;
  top:0!important;
  width:100%!important;
  height:calc(100vh - 34px)!important;
}
.titlebar{
  background:#000080;
  color:#fff;
  padding:3px 3px 3px 4px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:default;
  touch-action:none;
}
.window.blur .titlebar{
  background:#808080;
}
.tb-left{
  display:flex;
  align-items:center;
  gap:5px;
  overflow:hidden;
}
.tb-left .icn{
  width:16px;
  height:16px;
  object-fit:contain;
  flex:0 0 auto;
}
.tb-left b{
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.tb-buttons{
  display:flex;
  gap:2px;
  flex:0 0 auto;
}
.tb-buttons button{
  width:18px;
  height:16px;
  background:#c0c0c0;
  border:1px solid;
  border-color:#fff #404040 #404040 #fff;
  font-size:11px;
  line-height:1;
  cursor:pointer;
  padding:0;
  font-weight:bold;
}
.content{
  flex:1;
  overflow:auto;
  padding:10px;
  background:#c0c0c0;
}
.content.white{
  background:#fff;
  margin:2px;
  border:1px solid;
  border-color:#404040 #fff #fff #404040;
}
.content h2{
  margin-top:0;
  font-size:15px;
}
.content p{
  line-height:1.5;
  margin:0 0 10px;
}
.proj{
  background:#fff;
  border:1px solid;
  border-color:#404040 #fff #fff #404040;
  padding:6px 8px;
  margin-bottom:8px;
}
.proj b{
  display:block;
}
.proj small{
  color:#333;
  display:block;
  margin-top:2px;
}
.proj a{
  color:#0000ee;
  font-size:12px;
}
.field{
  margin-bottom:8px;
}
.field label{
  display:block;
  font-weight:bold;
  margin-bottom:2px;
}
.field input{
  width:100%;
  border:1px solid;
  border-color:#404040 #fff #fff #404040;
  padding:4px;
  font:inherit;
  background:#fff;
}
.btn{
  background:#c0c0c0;
  border:1px solid;
  border-color:#fff #404040 #404040 #fff;
  padding:4px 12px;
  font:inherit;
  cursor:pointer;
}
.btn:active{
  border-color:#404040 #fff #fff #404040;
}
.ie-toolbar{
  display:flex;
  gap:4px;
  padding:4px;
  background:#c0c0c0;
  border-bottom:1px solid #404040;
  flex-wrap:wrap;
}
.ie-toolbar input{
  flex:1;
  min-width:100px;
  border:1px solid;
  border-color:#404040 #fff #fff #404040;
  padding:4px;
  font:inherit;
}
.ie-page{
  padding:16px;
  background:#fff;
  height:100%;
}
.ie-page h2{
  margin-top:0;
}
.ie-page a{
  display:block;
  color:#0000ee;
  margin:6px 0;
}
.swatches{
  display:flex;
  gap:6px;
  margin:8px 0;
}
.swatch{
  width:26px;
  height:26px;
  border:2px solid #404040;
  cursor:pointer;
}
.cp-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}
ul.clean{
  margin:0;
  padding-left:18px;
}
ul.clean li{
  margin-bottom:4px;
}
textarea{
  width:100%;
  height:100%;
  border:none;
  resize:none;
  font-family:"Courier New",monospace;
  font-size:13px;
  padding:6px;
}
#taskbar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:34px;
  background:#c0c0c0;
  border-top:2px solid #fff;
  display:flex;
  align-items:center;
  padding:2px 3px;
  gap:4px;
  z-index:9999;
}
#startbtn{
  height:26px;
  padding:0 8px;
  background:#c0c0c0;
  border:1px solid;
  border-color:#fff #404040 #404040 #fff;
  font-weight:bold;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:5px;
  cursor:pointer;
}
#startbtn.active{
  border-color:#404040 #fff #fff #404040;
}
#startbtn .icn{
  width:18px;
  height:18px;
  object-fit:contain;
}
#tasks{
  display:flex;
  gap:3px;
  flex:1;
  overflow-x:auto;
}
.taskitem{
  height:26px;
  padding:0 8px;
  background:#c0c0c0;
  border:1px solid;
  border-color:#fff #404040 #404040 #fff;
  display:flex;
  align-items:center;
  gap:4px;
  font-size:12px;
  max-width:150px;
  cursor:pointer;
  flex:0 0 auto;
}
.taskitem .icn{
  width:14px;
  height:14px;
  object-fit:contain;
}
.taskitem.pressed{
  border-color:#404040 #fff #fff #404040;
  background:#a8a8a8;
}
.taskitem span{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#clock{
  border:1px solid;
  border-color:#404040 #fff #fff #404040;
  padding:3px 8px;
  font-size:12px;
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  line-height:1.25;
  min-width:52px;
}
#clock-date{
  font-size:10px;
  color:#303030;
}
#startmenu{
  position:fixed;
  left:2px;
  bottom:34px;
  width:200px;
  background:#c0c0c0;
  border:2px solid;
  border-color:#fff #404040 #404040 #fff;
  display:none;
  flex-direction:row;
  z-index:10000;
  box-shadow:3px 3px 6px rgba(0,0,0,.5);
}
#startmenu.open{
  display:flex;
}
.sm-strip{
  width:22px;
  background:#000080;
  color:#fff;
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:14px;
  letter-spacing:1px;
}
.sm-items{
  flex:1;
  padding:3px;
}
.smitem{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 8px;
  cursor:pointer;
  font-size:13px;
}
.smitem:hover{
  background:#000080;
  color:#fff;
}
.smitem .icn{
  width:20px;
  height:20px;
  object-fit:contain;
}
.smsep{
  height:1px;
  background:#808080;
  border-bottom:1px solid #fff;
  margin:3px 2px;
}
#shutdown{
  position:fixed;
  inset:0;
  background:#008080;
  color:#fff;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  z-index:20000;
  font-size:16px;
}
#shutdown.open{
  display:flex;
}
.shutdown-icon{
  width:48px;
  height:48px;
  object-fit:contain;
}
@media (max-width:760px){
  .window{
    left:0!important;
    top:0!important;
    width:100%!important;
    height:calc(100vh - 34px)!important;
  }
  .dicon{
    width:64px;
  }
  .dicon span{
    font-size:12px;
  }
  #tasks{
    max-width:45%;
  }
  #startmenu{
    width:170px;
  }
  #clock{
    font-size:11px;
    padding:3px 5px;
    min-width:0;
  }
}
@media (max-width:420px){
  #clock-date{
    display:none;
  }
  .startlabel{
    display:none;
  }
}
</style>
</head>
<body>

<div id="desktop">
  <div class="desktop-icons" id="deskicons"></div>
</div>

<div id="startmenu">
  <div class="sm-strip">WINDOWS 98</div>
  <div class="sm-items" id="smitems"></div>
</div>

<div id="taskbar">
  <div id="startbtn">
    <img class="icn" src="../win98-icons/windows_button.ico" alt="">
    <span class="startlabel">Start</span>
  </div>
  <div id="tasks"></div>
  <div id="clock">
    <div id="clock-time"></div>
    <div id="clock-date"></div>
  </div>
</div>

<div id="shutdown">
  <img class="shutdown-icon" src="../win98-icons/shut_down_with_computer.ico" alt="">
  <div>It's now safe to turn off your computer.</div>
  <button class="btn" onclick="closeShutdown()">Turn back on</button>
</div>

<script>
const ICON_BASE="../win98-icons/";

const CONFIG={
  aboutParagraphs:[
    "Game Dev and programmer. I work in Lua, Luau (Roblox), C# (Unity & BepInEx game modding) and the web (frontend and backend).",
    "Programming has been my passion, it has it's pros and cons, but I personally find it fun to program - until I have to debug the code :("
  ],
  projects:[
    {title:"World of Countries",desc:"Roblox nation-building game - Luau"},
    {title:"Ages of Conflict Mods",desc:"C# BepInEx/Harmony mods - The Greatest Modpack"},
    {title:"AoC Forum",desc:"Forum available as a website for the game Ages of Conflict - uses React, Vite and Supabase.",link:"http://aoc-forum.pages.dev/"},
    {title:"Paintable World Map",desc:"Roblox EditableImage-based map painting system"}
  ],
  email:"asgolaatharv@gmail.com",
  github:"https://github.com/atharvasgola"
};

const APPS=[
  {id:"about",label:"About Me",icon:"user_card.ico"},
  {id:"projects",label:"Projects",icon:"directory_closed.ico"},
  {id:"contact",label:"Contact",icon:"envelope_closed.ico"},
  {id:"mycomputer",label:"My Computer",icon:"computer_win.ico"},
  {id:"recyclebin",label:"Recycle Bin",icon:"recycle_bin_empty.ico"},
  {id:"notepad",label:"Notepad",icon:"notepad.ico"},
  {id:"iexplore",label:"Internet Explorer",icon:"msie_box.ico"},
  {id:"settings",label:"Control Panel",icon:"directory_control_panel.ico"}
];

function icon(name){
  return '<img class="icn" src="'+ICON_BASE+name+'" alt="">';
}

function buildContent(id){
  if(id==="about"){
    return CONFIG.aboutParagraphs.map(p=>"<p>"+p+"</p>").join("");
  }

  if(id==="projects"){
    return CONFIG.projects.map(p=>
      '<div class="proj"><b>'+p.title+'</b><small>'+p.desc+"</small>"+
      (p.link?'<a href="'+p.link+'" target="_blank" rel="noopener">'+p.link+"</a>":"")+
      "</div>"
    ).join("");
  }

  if(id==="contact"){
    return '<div class="field"><label>Email</label><input readonly value="'+CONFIG.email+'"></div>'+
      '<div class="field"><label>GitHub</label><input readonly value="'+CONFIG.github+'"></div>';
  }

  if(id==="mycomputer"){
    return "<ul class=\"clean\"><li>Local Disk (C:)</li><li>Projects (D:)</li><li>Games (E:)</li></ul>";
  }

  if(id==="recyclebin"){
    return "<p>The Recycle Bin is empty.</p>";
  }

  if(id==="notepad"){
    return "<textarea>New Text Document</textarea>";
  }

  if(id==="settings"){
    return '<div class="cp-row"><b>Display Properties</b></div>'+
      "<div>Desktop background:</div>"+
      '<div class="swatches">'+
      '<div class="swatch" style="background:#008080" onclick="setBg(\'#008080\')"></div>'+
      '<div class="swatch" style="background:#000080" onclick="setBg(\'#000080\')"></div>'+
      '<div class="swatch" style="background:#800000" onclick="setBg(\'#800000\')"></div>'+
      '<div class="swatch" style="background:#004000" onclick="setBg(\'#004000\')"></div>'+
      '<div class="swatch" style="background:#404040" onclick="setBg(\'#404040\')"></div>'+
      "</div>";
  }

  if(id==="iexplore"){
    const forum=CONFIG.projects.find(p=>p.link);

    return '<div class="ie-toolbar">'+
      '<button class="btn" onclick="ieHome()">Home</button>'+
      '<input id="ieaddr" readonly value="about:home">'+
      '<button class="btn" onclick="ieHome()">Go</button>'+
      "</div>"+
      '<div class="ie-page">'+
      "<h2>Atharv Asgola - Home</h2>"+
      "<p>Welcome. Pick a link:</p>"+
      '<a href="'+forum.link+'" target="_blank" rel="noopener">AoC Forum</a>'+
      '<a href="'+CONFIG.github+'" target="_blank" rel="noopener">GitHub</a>'+
      '<a href="mailto:'+CONFIG.email+'">Email Me</a>'+
      "</div>";
  }

  return "";
}

function ieHome(){
  const input=document.getElementById("ieaddr");
  if(input)input.value="about:home";
}

function setBg(c){
  document.body.style.background=c;
}

let zTop=10;
const win={};
const isMobile=()=>window.innerWidth<=760;

function openWin(id){
  const app=APPS.find(a=>a.id===id);

  if(win[id]){
    restoreWin(id);
    return;
  }

  const el=document.createElement("div");
  el.className="window";
  el.id="w-"+id;

  const n=Object.keys(win).length;

  if(!isMobile()){
    el.style.left=(60+n*26)+"px";
    el.style.top=(40+n*26)+"px";
    el.style.width="380px";
    el.style.height="300px";
  }

  el.innerHTML=
    '<div class="titlebar" data-id="'+id+'">'+
      '<div class="tb-left">'+icon(app.icon)+"<b>"+app.label+"</b></div>"+
      '<div class="tb-buttons">'+
        '<button data-act="min">_</button>'+
        '<button data-act="max">&#9635;</button>'+
        '<button data-act="close">&times;</button>'+
      "</div>"+
    "</div>"+
    '<div class="content'+(id==="iexplore"?"":" white")+'" style="'+(id==="iexplore"?"padding:0":"")+'">'+buildContent(id)+"</div>"+
    '<div class="resize-handle"></div>';

  document.getElementById("desktop").appendChild(el);

  win[id]={
    el:el,
    min:false,
    max:isMobile()
  };

  if(isMobile()){
    el.classList.add("maximized");
  }

  bindWindow(el,id);
  addTask(id,app.label,app.icon);
  focusWin(id);
}

function bindWindow(el,id){
  const tb=el.querySelector(".titlebar");

  tb.addEventListener("pointerdown",e=>{
    if(e.target.closest(".tb-buttons"))return;

    focusWin(id);

    if(win[id].max)return;

    const sx=e.clientX;
    const sy=e.clientY;
    const ol=el.offsetLeft;
    const ot=el.offsetTop;

    function move(ev){
      el.style.left=(ol+ev.clientX-sx)+"px";
      el.style.top=Math.max(0,ot+ev.clientY-sy)+"px";
    }

    function up(){
      document.removeEventListener("pointermove",move);
      document.removeEventListener("pointerup",up);
    }

    document.addEventListener("pointermove",move);
    document.addEventListener("pointerup",up);
  });

  el.querySelector('[data-act="close"]').onclick=()=>closeWin(id);
  el.querySelector('[data-act="min"]').onclick=()=>minWin(id);
  el.querySelector('[data-act="max"]').onclick=()=>toggleMax(id);

  el.addEventListener("pointerdown",()=>focusWin(id));

  const rh=el.querySelector(".resize-handle");

  rh.addEventListener("pointerdown",e=>{
    e.stopPropagation();
    focusWin(id);

    if(win[id].max)return;

    const sx=e.clientX;
    const sy=e.clientY;
    const ow=el.offsetWidth;
    const oh=el.offsetHeight;

    function move(ev){
      el.style.width=Math.max(240,ow+ev.clientX-sx)+"px";
      el.style.height=Math.max(160,oh+ev.clientY-sy)+"px";
    }

    function up(){
      document.removeEventListener("pointermove",move);
      document.removeEventListener("pointerup",up);
    }

    document.addEventListener("pointermove",move);
    document.addEventListener("pointerup",up);
  });
}

function focusWin(id){
  Object.keys(win).forEach(k=>win[k].el.classList.add("blur"));

  win[id].el.classList.remove("blur");
  win[id].el.style.zIndex=++zTop;
  win[id].el.style.display="flex";
  win[id].min=false;

  document.querySelectorAll(".taskitem").forEach(t=>{
    t.classList.toggle("pressed",t.dataset.id===id);
  });
}

function minWin(id){
  win[id].el.style.display="none";
  win[id].min=true;

  const task=document.querySelector('.taskitem[data-id="'+id+'"]');

  if(task){
    task.classList.remove("pressed");
  }
}

function restoreWin(id){
  if(win[id].min){
    win[id].el.style.display="flex";
    win[id].min=false;
    focusWin(id);
  }else if(win[id].el.classList.contains("blur")){
    focusWin(id);
  }else{
    minWin(id);
  }
}

function toggleMax(id){
  if(isMobile())return;

  const w=win[id];

  w.max=!w.max;
  w.el.classList.toggle("maximized",w.max);

  focusWin(id);
}

function closeWin(id){
  win[id].el.remove();
  delete win[id];

  const t=document.querySelector('.taskitem[data-id="'+id+'"]');

  if(t)t.remove();
}

function addTask(id,label,iconName){
  const t=document.createElement("div");

  t.className="taskitem";
  t.dataset.id=id;
  t.innerHTML=icon(iconName)+"<span>"+label+"</span>";
  t.onclick=()=>restoreWin(id);

  document.getElementById("tasks").appendChild(t);
}

const deskicons=document.getElementById("deskicons");

APPS.forEach(a=>{
  const d=document.createElement("div");

  d.className="dicon";
  d.innerHTML=icon(a.icon)+"<span>"+a.label+"</span>";
  d.onclick=()=>openWin(a.id);

  deskicons.appendChild(d);
});

const smitems=document.getElementById("smitems");

APPS.forEach(a=>{
  const s=document.createElement("div");

  s.className="smitem";
  s.innerHTML=icon(a.icon)+"<span>"+a.label+"</span>";
  s.onclick=()=>{
    openWin(a.id);
    closeStart();
  };

  smitems.appendChild(s);
});

const sep=document.createElement("div");
sep.className="smsep";
smitems.appendChild(sep);

const sd=document.createElement("div");
sd.className="smitem";
sd.innerHTML=icon("shut_down_with_computer.ico")+"<span>Shut Down...</span";
sd.onclick=()=>{
  closeStart();
  openShutdown();
};

smitems.appendChild(sd);

const startbtn=document.getElementById("startbtn");
const startmenu=document.getElementById("startmenu");

startbtn.onclick=e=>{
  e.stopPropagation();
  startmenu.classList.toggle("open");
  startbtn.classList.toggle("active");
};

document.addEventListener("click",e=>{
  if(!startmenu.contains(e.target)&&!startbtn.contains(e.target)){
    closeStart();
  }
});

function closeStart(){
  startmenu.classList.remove("open");
  startbtn.classList.remove("active");
}

function openShutdown(){
  document.getElementById("shutdown").classList.add("open");
}

function closeShutdown(){
  document.getElementById("shutdown").classList.remove("open");
}

const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function tick(){
  const d=new Date();
  let h=d.getHours();
  const m=d.getMinutes();
  const ap=h>=12?"PM":"AM";

  h=h%12;

  if(h===0)h=12;

  document.getElementById("clock-time").textContent=
    h+":"+(m<10?"0":"")+m+" "+ap;

  document.getElementById("clock-date").textContent=
    MONTHS[d.getMonth()]+" "+d.getDate();
}

tick();
setInterval(tick,10000);

window.addEventListener("resize",()=>{
  if(isMobile()){
    Object.keys(win).forEach(id=>{
      win[id].el.classList.add("maximized");
      win[id].max=true;
    });
  }
});
</script>
</body>
</html>
